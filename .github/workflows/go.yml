# This workflow will build a golang project
# REQUIRES: secrets.RELEASE_TOKEN (Personal Access Token) to be configured in the repository secrets

env:
  GO_VERSION: 1.24.1
  PROJECT_NAME: go-fps

name: Go Multi-Build
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-darwin:
    name: Build MacOS X Executable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install glfw
        run: brew install glfw

      - name: Create Build directory
        run: mkdir "$PROJECT_NAME"

      - name: Build
        run: CGOENABLED=1 go build -o "./$PROJECT_NAME/$PROJECT_NAME" -v .

      - name: Copy assets
        run: cp -r assets "$PROJECT_NAME/assets"

      - name: Create Archive
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ${{ env.PROJECT_NAME }}-mac.zip
          directory: .
          path: ${{ env.PROJECT_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            ${{ env.PROJECT_NAME }}-mac.zip

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2.2.0
        with:
          platform: x64
          version: 12.2.0

      - name: Create Build directory
        run: md "$env:PROJECT_NAME"

      - name: Build
        run: go build -o "$env:PROJECT_NAME\$env:PROJECT_NAME.exe" .
        env:
          CGO_ENABLED: 1

      - name: Copy assets
        run: Copy-Item -Path assets -Destination "$env:PROJECT_NAME\assets" -Recurse -Container

      - name: Create Archive
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ${{ env.PROJECT_NAME }}-windows.zip
          directory: .
          path: ${{ env.PROJECT_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |
            ${{ env.PROJECT_NAME }}-windows.zip

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache APT Packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libxxf86vm-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev
        version: 1.0

    - name: Create Build directory
      run: mkdir "$PROJECT_NAME"

    - name: Build
      run: CGOENABLED=1 go build -o "./$PROJECT_NAME/$PROJECT_NAME" -v .

    - name: Copy assets
      run: cp -r assets "$PROJECT_NAME/assets"

    - name: Create Archive
      uses: thedoctor0/zip-release@0.7.5
      with:
        type: 'zip'
        filename: ${{ env.PROJECT_NAME }}-linux.zip
        directory: .
        path: ${{ env.PROJECT_NAME }}

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: |
          ${{ env.PROJECT_NAME }}-linux.zip