# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
env:
  GO_VERSION: 1.24.1
  PROJECT_NAME: go-fps

name: Go Multi-Build
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache APT Packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: libxxf86vm-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev
        version: 1.0
        
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Create Build directory
      run: mkdir build

    - name: Copy assets
      run: cp -r assets build/assets

    - name: Build
      run: CGOENABLED=1 go build -o "./build/$PROJECT_NAME" -v .

    - name: Archive Release
      uses: thedoctor0/zip-release@0.7.5
      with:
        type: 'zip'
        filename: ${{ env.PROJECT_NAME }}.zip
        directory: .
        path: 'build'

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: |
          ${{ env.PROJECT_NAME }}.zip