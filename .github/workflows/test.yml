# Build, vet and test on every push. The release workflow in go.yml only runs on
# tags, which is too late to find out that the tree is broken.

env:
  GO_VERSION: 1.24.1

name: Go Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Vet and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      # cgo needs these to build the glfw binding. The tests themselves open no
      # window and need no GL context.
      - name: Cache APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libxxf86vm-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev
          version: 1.1

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
